[project]
name = "CMN-C2-672"
version = "0.1.0"
description = "Assembles a cited evidence packet and recommendation for enterprise data retention exception and disposal requests"
requires-python = ">=3.11"
# agenticstar-agentcore is not on public PyPI; the real STG/prod install path
# (`uv pip install -e .` against the internal package registry) reads this
# dependencies list directly, so the extra + version must be declared here —
# see .claude/skills/agenticstar-deploy/SKILL.md "pyproject.toml must declare
# the LLM extra + the langchain-core fix". Version/extras mirror
# agenticstar-deploy/run_build_agent.sh's AGENTCORE_WHEEL_SPEC. `openai` ->
# langchain_openai, needed by DecisionBriefService's AzureOpenAIClient call —
# the only real (non-mock) integration in this agent.
dependencies = [
    "agenticstar-agentcore[openai,marketplace]==1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv]
# agenticstar-agentcore's published package-index metadata pins a
# langchain-core version incompatible with what its own "openai" extra
# (-> langchain-openai) requires — unsatisfiable via normal resolution.
# Force the SDK-compatible version actually shipped in the wheel.
override-dependencies = [
    "langchain-core==1.5.4",
]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# agenticstar-agentcore ships no py.typed marker (verified: no framework/py.typed
# under site-packages), so every framework.*/shared.* import resolves to Any — an
# upstream SDK packaging gap, not something fixable from this template. Silence
# the resulting import-untyped noise without weakening strict-mode checks on this
# project's own code.
module = ["framework.*", "shared.*", "yaml", "sniffio", "sniffio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Subclassing the SDK's Any-typed base classes (FunctionNode, AgentBaseGraph,
# AgentState) is the sanctioned pattern (sdk-expertise skill) — disable only
# the one strict-mode check that would otherwise flag every node/graph class
# in this project for that.
module = "src.*"
disallow_subclassing_any = false
